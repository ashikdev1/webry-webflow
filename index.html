<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webry</title>
    <script src="https://kit.fontawesome.com/dafcd03be5.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./styles/style.css">
</head>

<body class="poppins-regular">
    <header>
        <nav class="navbar container">
            <div class="logo">
                <img src="./photo/webry-logo.png" alt="">
            </div>
            <div class="naem">
                <button class="btn">signup</button>
            </div>

        </nav>

        <div class="banner container">
            <h2>Cool Dark UI Template for<br> Webflow Agencies!</h2>
            <div class="banner-btn">
                <button class="banner-btn">see more</button>
            </div>
        </div>
    </header>
    <!-- section part-->
    <section class="hero-section container">
        <!--  Text Block -->
        <div class="content-area">
            <h1>See It in Action</h1>
            <p>Explore the live preview and imagine your brand in this bold new look.</p>
            <button class="preview-btn">Launch Live Preview</button>
        </div>

        <!--  Image Block -->
        <div class="image-area">
            <div class="image-wrapper">
                <img src="./photo/wc-mini.png" alt="Webflow Conf Preview">
            </div>
        </div>
    </section>

</body>

</html>
